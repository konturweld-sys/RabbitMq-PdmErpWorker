name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\EKK.sln

      - name: Build Release
        run: dotnet build .\EKK.sln --configuration Release --no-restore

      - name: Validate PowerShell deployment script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\EKK_Deploy.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }

      - name: Publish self-contained Windows x64 package
        run: >
          dotnet publish .\src\Ekk.Host\Ekk.Host.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output .\artifacts\package
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Add deployment files
        shell: pwsh
        run: |
          Copy-Item .\EKK_Deploy.ps1 .\artifacts\package\EKK_Deploy.ps1
          Copy-Item .\README.md .\artifacts\package\README.md

      - name: Upload compiled EKK package
        uses: actions/upload-artifact@v4
        with:
          name: EKK-win-x64-${{ github.sha }}
          path: .\artifacts\package\**
          if-no-files-found: error
          retention-days: 30
